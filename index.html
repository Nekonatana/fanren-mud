/* ===== PWA 启动参数处理 (manifest shortcuts) ===== */
(function handleLaunchParams() {
  try {
    var qs = new URLSearchParams(window.location.search);
    var action = qs.get('action');
    if (!action) return;
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        try {
          if (action === 'newgame') {
            if (typeof Game === 'object' && typeof Game.startNewGame === 'function') {
              Game.startNewGame();
            }
          } else if (action === 'continue') {
            if (typeof Game === 'object' && typeof Game.loadGame === 'function') {
              Game.loadGame();
            }
          } else if (action === 'savepanel') {
            if (typeof UI === 'object' && typeof UI.showSavePanel === 'function') {
              UI.showSavePanel('load');
            }
          }
        } catch (e) {}
      }, 800);
    });
  } catch (e) {}
})();

/* ===== Service Worker 注册 (PWA离线支持 + 自动更新) ===== */
var SW_REG = null;
var PWA_INSTALL_EVENT = null;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js?v=pwa7')
      .then(function(reg) {
        SW_REG = reg;
        // 检查更新
        reg.addEventListener('updatefound', function() {
          var nw = reg.installing;
          nw.addEventListener('statechange', function() {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              // 新版本已下载，提示用户刷新
              showUpdatePrompt('发现新版本，已准备就绪！', '点击立即更新');
            }
          });
        });
        // 启动时检查一次更新
        reg.update();
      })
      .catch(function(err) {});

    // 监听来自SW的消息
    navigator.serviceWorker.addEventListener('message', function(event) {
      var data = event.data;
      if (!data) return;

      if (data.type === 'SW_ACTIVATED') {
        // SW已激活
      }

      if (data.type === 'UPDATE_CHECKING') {
        if (typeof showToast === 'function') {
          showToast('正在检查更新...', 'info');
        }
      }

      if (data.type === 'UPDATE_RESULT') {
        if (data.error) {
          if (typeof showToast === 'function') {
            showToast('检查更新失败，可能是离线状态', 'warn');
          }
        } else if (data.hasUpdate) {
          showUpdatePrompt('发现新版本 ' + data.latestVersion, '点击立即更新');
        } else {
          if (typeof showToast === 'function') {
            showToast('当前已是最新版本', 'success');
          }
        }
      }

      if (data.type === 'FORCE_RELOAD') {
        // 强制重载
        window.location.reload();
      }
    });
  });
}

/* ===== 检查更新 ===== */
function checkAppUpdate() {
  if (!SW_REG) {
    if (typeof showToast === 'function') {
      showToast('离线模式，无法检查更新', 'warn');
    }
    return;
  }
  SW_REG.update().then(function() {
    // 同时发送消息给SW做版本比较
    navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage('CHECK_UPDATE');
    // 如果没有controller（首次安装），直接提示
    if (!navigator.serviceWorker.controller) {
      if (typeof showToast === 'function') {
        showToast('当前已是最新版本', 'success');
      }
    }
  }).catch(function() {
    if (typeof showToast === 'function') {
      showToast('检查更新失败', 'danger');
    }
  });
}

/* ===== 显示更新提示 ===== */
function showUpdatePrompt(title, btnText) {
  // 创建更新提示弹窗
  var existing = document.getElementById('update-prompt');
  if (existing) existing.remove();

  var overlay = document.createElement('div');
  overlay.id = 'update-prompt';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:99999;display:flex;align-items:center;justify-content:center;';

  var box = document.createElement('div');
  box.style.cssText = 'background:var(--bg-card,#1a2332);border:1px solid var(--gold,#d4a857);border-radius:12px;padding:24px 32px;max-width:360px;text-align:center;box-shadow:0 0 40px rgba(212,168,87,0.3);';

  var icon = document.createElement('div');
  icon.style.cssText = 'font-size:48px;margin-bottom:12px;';
  icon.textContent = '🔄';

  var titleEl = document.createElement('div');
  titleEl.style.cssText = 'color:var(--gold-bright,#f0c75e);font-size:18px;font-weight:bold;margin-bottom:8px;';
  titleEl.textContent = title;

  var desc = document.createElement('div');
  desc.style.cssText = 'color:var(--text-dim,#7a7568);font-size:13px;margin-bottom:16px;';
  desc.textContent = '更新后将重新加载游戏，请确保已保存进度。';

  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:12px;justify-content:center;';

  var btnUpdate = document.createElement('button');
  btnUpdate.style.cssText = 'background:var(--gold,#d4a857);color:#0a0e14;border:none;padding:10px 24px;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;';
  btnUpdate.textContent = btnText;
  btnUpdate.onclick = function() {
    // 通知SW强制更新
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage('FORCE_UPDATE');
    }
    // 同时直接刷新
    setTimeout(function() { window.location.reload(); }, 500);
  };

  var btnLater = document.createElement('button');
  btnLater.style.cssText = 'background:transparent;color:var(--text-dim,#7a7568);border:1px solid var(--text-dim,#7a7568);padding:10px 20px;border-radius:6px;font-size:13px;cursor:pointer;';
  btnLater.textContent = '稍后';
  btnLater.onclick = function() { overlay.remove(); };

  btnRow.appendChild(btnUpdate);
  btnRow.appendChild(btnLater);
  box.appendChild(icon);
  box.appendChild(titleEl);
  box.appendChild(desc);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  // 8秒后自动消失（如果用户不操作）
  setTimeout(function() {
    if (document.getElementById('update-prompt')) {
      overlay.remove();
    }
  }, 8000);
}

/* ===== PWA 安装提示 ===== */
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  PWA_INSTALL_EVENT = e;
  // 延迟显示安装提示
  setTimeout(function() {
    if (window.localStorage.getItem('pwa_install_dismissed')) return;
    showPWAInstallPrompt();
  }, 5000);
});

function showPWAInstallPrompt() {
  if (!PWA_INSTALL_EVENT) return;

  var existing = document.getElementById('pwa-install-prompt');
  if (existing) existing.remove();

  var btn = document.createElement('div');
  btn.id = 'pwa-install-prompt';
  btn.style.cssText = 'position:fixed;top:12px;right:12px;background:var(--bg-card,#1a2332);border:1px solid var(--gold,#d4a857);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;z-index:99998;box-shadow:0 4px 16px rgba(0,0,0,0.5);cursor:pointer;transition:all 0.2s;';

  btn.innerHTML = '<span style="font-size:20px;">📲</span>' +
    '<span style="color:var(--gold-bright,#f0c75e);font-size:13px;font-weight:bold;">安装桌面版</span>' +
    '<span style="color:var(--text-dim,#7a7568);font-size:16px;margin-left:4px;">›</span>';

  btn.onclick = function() {
    PWA_INSTALL_EVENT.prompt();
    PWA_INSTALL_EVENT.userChoice.then(function(choice) {
      if (choice.outcome === 'accepted') {
        if (typeof showToast === 'function') showToast('安装成功！可在主屏幕打开', 'success');
      }
      PWA_INSTALL_EVENT = null;
      btn.remove();
    });
  };

  // 悬停效果
  btn.onmouseenter = function() { btn.style.borderColor = 'var(--gold-bright,#f0c75e)'; btn.style.boxShadow = '0 4px 20px rgba(240,199,94,0.3)'; };
  btn.onmouseleave = function() { btn.style.borderColor = 'var(--gold,#d4a857)'; btn.style.boxShadow = '0 4px 16px rgba(0,0,0,0.5)'; };

  // 长按右键关闭
  btn.oncontextmenu = function(e) {
    e.preventDefault();
    window.localStorage.setItem('pwa_install_dismissed', '1');
    btn.remove();
  };

  document.body.appendChild(btn);

  // 15秒后自动消失
  setTimeout(function() {
    if (document.getElementById('pwa-install-prompt')) {
      btn.remove();
    }
  }, 15000);
}

/* ===== 移动端体验优化 ===== */
(function() {
  // 阻止双击缩放
  var lastTouch = 0;
  document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTouch <= 300) { e.preventDefault(); }
    lastTouch = now;
  }, { passive: false });

  // 阻止下拉刷新（非叙事区）
  document.addEventListener('touchmove', function(e) {
    var el = e.target;
    var scrollable = false;
    while (el && el !== document.body) {
      var style = window.getComputedStyle(el);
      if (style.overflowY === 'auto' || style.overflowY === 'scroll') {
        scrollable = true;
        break;
      }
      el = el.parentElement;
    }
    if (!scrollable && (document.scrollingElement.scrollTop || document.body.scrollTop) === 0) {
      // 允许在可滚动区域内的触摸移动
    }
  }, { passive: true });

  // 阻止iOS橡皮筋效果在外层
  document.body.addEventListener('touchstart', function(){}, { passive: true });

  // 防止键盘弹出时页面跳动
  window.addEventListener('resize', function() {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') {
      setTimeout(function() {
        document.activeElement.scrollIntoView({ block: 'center' });
      }, 300);
    }
  });
})();
</script>
